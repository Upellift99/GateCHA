name: Release Binaries

# Runs on the tags created by release-please and attaches cross-platform
# binaries (with the embedded SPA) to the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # upload release assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # Build the Vue SPA and copy it into internal/dashboard/dist so go:embed
      # bundles it into every binary GoReleaser produces.
      - name: Build embedded frontend
        run: |
          npm --prefix web ci
          make frontend

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
