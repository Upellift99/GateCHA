name: Release Binaries

# Runs on the tags created by release-please and attaches cross-platform
# binaries (with the embedded SPA) to the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # upload release assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Build the Vue SPA and copy it into internal/dashboard/dist so go:embed
      # bundles it into every binary GoReleaser produces.
      - name: Build embedded frontend
        run: |
          npm --prefix web ci
          make frontend

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must stay a bare major.minor so setup-go resolves the latest patch.
          # Do NOT switch back to go-version-file: go.mod — the `go 1.25.0`
          # directive there made release builds pin Go 1.25.0 exactly, shipping
          # binaries with 20 reachable stdlib vulnerabilities while the Docker
          # image (golang:1.26-alpine) was patched.
          go-version: "1.26"
          # A bare major.minor alone is NOT enough: setup-go checks the runner's
          # tool cache first, and any cached 1.26.x satisfies the spec, so the
          # manifest holding the newest patch is never consulted. That is how CI
          # kept building on go1.26.5 for days after 1.26.6 shipped.
          check-latest: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
