name: Go

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least-privilege default for all jobs (override per-job if a job needs more).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Build frontend (for embed)
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          cp -r web/dist internal/dashboard/dist

      - name: Verify Go build
        run: go build ./cmd/gatecha/

      - name: Run Go tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Upload Go coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd web && npm ci

      - name: Type check
        run: cd web && npx vue-tsc -b

      - name: Run tests with coverage
        run: cd web && npx vitest run --coverage

      - name: Build
        run: cd web && npm run build

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: web/coverage/lcov.info

  # Real-browser smoke test of the dashboard login captcha against a running
  # binary. Unit tests mock the ALTCHA widget, so a widget release that rejected
  # every challenge (altcha 3.4.0) passed CI and locked admins out.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build frontend and binary
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          cp -r web/dist internal/dashboard/dist
          go build -o gatecha ./cmd/gatecha

      - name: Start GateCHA
        env:
          GATECHA_ADMIN_PASSWORD: e2e-admin-password
          GATECHA_DB_DSN: ${{ runner.temp }}/gatecha.db
          GATECHA_LISTEN_ADDR: 127.0.0.1:8080
        run: |
          ./gatecha > "$RUNNER_TEMP/gatecha.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/gatecha.log"; exit 1

      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          GATECHA_URL: http://127.0.0.1:8080
          GATECHA_ADMIN_PASSWORD: e2e-admin-password
        run: cd web && npm run test:e2e

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/gatecha.log"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Build frontend (for embed)
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          cp -r web/dist internal/dashboard/dist

      - name: Run go vet
        run: go vet ./...

  # Catches vulnerabilities Dependabot cannot see, notably in the Go standard
  # library, which is what let release binaries ship on a stale toolchain.
  # Every setup-go step here carries `check-latest: true`: without it setup-go
  # accepts whatever patch of that minor the runner image already caches, so this job would
  # scan an older stdlib than the one a fresh release actually builds against.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      # Required: internal/dashboard uses //go:embed dist/*, so the directory
      # must exist before any tool can load the packages.
      - name: Build frontend (for embed)
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          cp -r web/dist internal/dashboard/dist

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan for known vulnerabilities
        run: govulncheck ./...

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        # Floating major tag on purpose: Dependabot cannot watch service images
        # (its github-actions ecosystem only bumps `uses:` refs), so a pinned
        # version here would rot unnoticed. A floating tag picks up patches on
        # every run instead. CI-only, never shipped.
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gatecha_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Build frontend (for embed)
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          cp -r web/dist internal/dashboard/dist

      - name: Verify MySQL build
        run: go build -tags mysql ./cmd/gatecha/

      - name: Run MySQL integration tests
        env:
          GATECHA_TEST_MYSQL_DSN: "root:root@tcp(localhost:3306)/gatecha_test?parseTime=true&charset=utf8mb4&loc=UTC"
        # -p 1: run packages sequentially — MySQL tests share one database,
        # concurrent packages would race on schema creation/deletion.
        run: go test -tags mysql -p 1 ./...

  sonarqube:
    runs-on: ubuntu-latest
    needs: [test, lint, frontend]
    # Fork PRs get no secrets, so the scan fails on an empty SONAR_HOST_URL
    # ("URI with undefined scheme"). Skip it there instead of showing a red check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Go coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage

      - name: Download frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: web/coverage

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
