name: Docker

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # docker/build-push-action uploads a `.dockerbuild` build summary as a
  # workflow artifact on every run. Nobody reads them, and they count against
  # the 0.5 GB Actions storage quota: ~1000 of them had piled up across the
  # personal repos by 2026-08-24, one per build, kept for the default 90 days.
  DOCKER_BUILD_SUMMARY: false

# Now that :latest follows the newest release tag, two tag builds running at
# once could finish out of order and leave :latest on the older one. Put every
# tag run in one group so they publish in sequence; branches and PRs keep their
# own groups and still run in parallel. Never cancel — a cancelled run would
# skip a publish rather than merely delay it.
concurrency:
  group: docker-${{ github.ref_type == 'tag' && 'release-tags' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `git describe` can reach the latest tag when resolving
          # the build version shown in the dashboard footer.
          fetch-depth: 0
          # Nothing here pushes; `git describe` is local. Don't leave the token in
          # .git/config for later steps to read.
          persist-credentials: false

      # Only the runtime stage's few RUN steps execute under emulation for
      # arm64; the Go binary is cross-compiled natively (see Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto applies :latest only on a non-prerelease semver tag push,
          # so :latest is the newest release. It used to track the default branch,
          # which meant the README's `docker run …:latest` handed operators an
          # unreleased main build. Branch builds stay reachable as :main.
          # Caveat: metadata-action does not compare against existing tags, so
          # re-pushing an older tag would move :latest backwards. release-please
          # only ever tags forward, so that case does not arise here.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Same tags with a -mysql suffix. onlatest=true matters: without it :latest
      # gets no suffix and the mysql image would overwrite the default :latest.
      - name: Extract metadata (mysql)
        id: meta-mysql
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          bake-target: docker-metadata-action-mysql
          flavor: |
            latest=auto
            suffix=-mysql,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # metadata-action's version output is the branch name on branch pushes, so
      # branch images would bake main.version=main and the footer would show
      # "main" instead of a version. Tags keep the clean semver; branches get a
      # describe-based string like v0.3.2-3-g8f24823.
      - name: Resolve build version
        id: version
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "value=$META_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          # List files explicitly so the compose files in the repo root are not
          # picked up as extra bake targets. The metadata bake files come last
          # so their tags and labels override the placeholders.
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
            cwd://${{ steps.meta-mysql.outputs.bake-file-tags }}
            cwd://${{ steps.meta-mysql.outputs.bake-file-labels }}
          push: ${{ github.event_name != 'pull_request' }}
          targets: default
          # Separate cache scopes, or the two targets overwrite each other's cache.
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max
            mysql.cache-from=type=gha,scope=mysql
            mysql.cache-to=type=gha,scope=mysql,mode=max
