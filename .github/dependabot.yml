version: 2
updates:
  # Go modules (backend)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # Majors are deliberately left out so they open as individual PRs
      # instead of riding along unreviewed inside a large group diff.
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # npm (Vue frontend)
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # Majors are deliberately left out so they open as individual PRs
      # instead of riding along unreviewed inside a large group diff
      # (pinia 3 -> 4 shipped this way in #99).
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 (native port) drops the ./lib/tsc subpath export that
      # vue-tsc relies on. Unignore once vue-tsc supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # init and analyze must move together: CodeQL fails the run when the
      # steps do not all use the same version of the action.
      codeql-action:
        patterns:
          - "github/codeql-action*"
